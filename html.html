<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>
    <style>
        body {
            font-family: Arial;
            background: #e9edf2;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
        }
        .header {
            background: #0a3b7b;
            color: white;
            padding: 12px 20px;
            border-radius: 10px 10px 0 0;
        }
        .header img {
            height: 40px;
            vertical-align: middle;
            margin-right: 15px;
        }
        .header h1 {
            display: inline;
            font-size: 18px;
        }
        .content {
            padding: 20px;
        }
        .photo {
            width: 100px;
            height: 140px;
            border-radius: 8px;
            display: inline-block;
            margin-right: 20px;
            vertical-align: top;
        }
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        .about {
            display: inline-block;
            width: 60%;
            vertical-align: top;
        }
        .about h2 {
            font-size: 18px;
            color: blue;
            margin: 0 0 8px 0;
        }
        .about p {
            background: rgb(201, 198, 198);
            padding: 10px;
            border-radius: 8px;
            margin: 0;
        }
        .skills, .contacts {
            background: rgb(204, 203, 203);
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 20px;
            display: inline-block;
            width: 45%;
            vertical-align: top;
        }
        .skills {
            margin-right: 20px;
        }
        .skills h3, .contacts h3 {
            font-size: 16px;
            color: blue;
            margin: 0 0 8px 0;
        }
        .tag {
            background: white;
            padding: 2px 12px;
            border-radius: 15px;
            font-size: 13px;
            border: 1px solid white;
            display: inline-block;
            margin: 3px;
        }
        .contact-line {
            font-size: 14px;
            margin: 5px 0;
        }
        .contact-line span {
            font-weight: bold;
            display: inline-block;
            width: 60px;
        }
        .contact-line a {
            color: blue;
            text-decoration: none;
        }
        .footer {
            background: blue;
            text-align: center;
            color: white;
            padding: 10px;
            font-size: 13px;
            border-radius: 0 0 10px 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <img src="https://ксипт.рф/wp-content/uploads/2025/02/logo_ksipt-1.png" alt="Логотип КСИПТ">
        <h1>Косубицкий Дмитрий Александрович</h1>
    </div>

    <div class="content">

        <div class="photo">
            <img src="https://img.magnific.com/free-photo/ancient-tree-guardian_23-2151947995.jpg?semt=ais_hybrid&w=740&q=80" alt="Фото студента">
        </div>
        <div class="about">
            <h2>Обо мне</h2>
            <p>Студент 2-го курса. Учусь веб-разработке. Знаю HTML и CSS.</p>
        </div>

        <div class="skills">
            <h3>Навыки</h3>
            <div>
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">Word</span>
                <span class="tag">Excel</span>
            </div>
        </div>

        <div class="contacts">
            <h3>Контакты</h3>
            <div class="contact-line"><span>Email:</span> <a href="mailto:student@mail.ru">student@mail.ru</a></div>
            <div class="contact-line"><span>Тел.:</span> <a href="tel:+79001234567">+7 (900) 123-45-67</a></div>
        </div>

    </div>

    <div class="footer">
        © 2026 Косубицкий Дмитрий Александрович
    </div>

</div>

</body>
</html>
